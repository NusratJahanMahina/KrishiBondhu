{% extends "base.html" %}
{% block title %}কৃষক ড্যাশবোর্ড - কৃষিবন্ধু{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body text-center">
                    <i class="fas fa-user-circle fa-4x text-success mb-3"></i>
                    <h5>{{ user.first_name }} {{ user.last_name }}</h5>
                    <p class="text-muted"><i class="fas fa-tractor me-2"></i>কৃষক</p>
                    <span class="badge bg-success">Active</span>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0"><i class="fas fa-tachometer-alt me-2"></i>ড্যাশবোর্ড</h5>
                </div>
                <div class="card-body">
                    <p>স্বাগতম! আপনার ড্যাশবোর্ড শীঘ্রই আসছে। / Welcome! Your dashboard is coming soon.</p>
                    <div class="row g-3 mt-2">
                        <div class="col-6">
                            <div class="p-3 bg-light rounded">
                                <i class="fas fa-hand-holding-usd text-success"></i>
                                <span class="d-block mt-1">ঋণ আবেদন</span>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="p-3 bg-light rounded">
                                <i class="fas fa-seedling text-success"></i>
                                <span class="d-block mt-1">পরামর্শ</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
